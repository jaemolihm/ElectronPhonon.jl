codecov:
  notify:
    # CI uploads two reports per commit (flags `core` and `plotting`); post nothing until both have arrived.
    after_n_builds: 2
comment:
  after_n_builds: 2
coverage:
  status:
    # GPU-only code runs on no CI runner, so coverage is reported but never fails a PR.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
